[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "verified-backup"
version = "0.1.0"
description = "Hash-verified zip/tar.gz backups with manifests, and no-overwrite restore that verifies every file."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "willind" }]
keywords = ["backup", "restore", "sha256", "checksum", "manifest", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
verified-backup = "verified_backup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verified_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
